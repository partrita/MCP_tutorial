name: Temporary uv lock refresh

on:
  push:
    branches:
      - security/dependabot-2026-08

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Refresh lockfile for security fixes
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv lock --upgrade-package gradio --upgrade-package fastapi --upgrade-package starlette --upgrade-package python-multipart --upgrade-package orjson

      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: refresh uv lock for security fixes" || true
          git rm .github/workflows/temporary-uv-lock-refresh.yml
          git commit -m "chore: remove temporary uv lock refresh workflow" || true
          git push origin HEAD:security/dependabot-2026-08
